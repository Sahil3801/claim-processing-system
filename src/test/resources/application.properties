spring.datasource.url=jdbc:h2:mem:claims;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
security.jwt.secret=test-only-jwt-secret-that-is-at-least-thirty-two-characters
security.jwt.issuer=claims-processing-api-test
security.jwt.expiration-ms=900000

# External infrastructure is not required for the baseline context test.
spring.kafka.listener.auto-startup=false
claims.kafka.create-topics=false
spring.task.scheduling.enabled=false
spring.mail.test-connection=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

claims.cache.detail-ttl=PT10M
claims.cache.status-ttl=PT5M
