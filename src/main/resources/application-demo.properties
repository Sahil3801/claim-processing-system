# Low-cost public demo profile (Render, Railway), used with "production":
# SPRING_PROFILES_ACTIVE=production,demo. Only PostgreSQL is required.

# Hosts inject PORT. The default all-interfaces bind is dual-stack where IPv6 exists, so the bind
# address is left unset.
server.port=${PORT:8080}

# No Kafka broker: status events are still written to the transactional outbox in PostgreSQL,
# but the relay and email consumer stay off.
claims.outbox.relay.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
claims.kafka.create-topics=false

# Redis is optional here; enable the cache only when REDIS_HOST points at a real instance.
claims.cache.enabled=${CLAIMS_CACHE_ENABLED:false}

# Small free-tier container: keep the database pool and Tomcat threads modest.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:30}
