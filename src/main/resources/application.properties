# Application name configuration
spring.application.name=Processing
server.port=${SERVER_PORT:8080}

# Only non-sensitive liveness information is exposed for container orchestration.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# PostgreSQL is the production source of truth. DB_PASSWORD is intentionally required.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claims_processing}}
spring.datasource.username=${DB_USERNAME:claims_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation; Hibernate only checks that mappings and migrations agree.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT secrets are supplied by the runtime environment and are never committed.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:claims-processing-api}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Email configuration for Spring Boot to use Gmail for sending emails
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}

# Kafka claim-status event flow. One partition/replica is the low-cost local default;
# production deployments can increase both through environment variables.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CLAIM_STATUS_GROUP:claims-notifications-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
claims.kafka.topics.claim-status=${KAFKA_CLAIM_STATUS_TOPIC:claims.status.v1}
claims.kafka.topics.claim-status-dlt=${KAFKA_CLAIM_STATUS_DLT_TOPIC:claims.status.v1.dlt}
claims.kafka.retry.interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}
claims.kafka.retry.max-retries=${KAFKA_MAX_RETRIES:2}
claims.kafka.create-topics=${KAFKA_CREATE_TOPICS:true}
claims.kafka.topic-partitions=${KAFKA_TOPIC_PARTITIONS:1}
claims.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}

# Transactional outbox relay: events commit with the claim change and are relayed to Kafka.
claims.outbox.relay.enabled=${CLAIMS_OUTBOX_RELAY_ENABLED:true}
claims.outbox.relay.interval=${CLAIMS_OUTBOX_RELAY_INTERVAL:PT1S}
claims.outbox.relay.batch-size=${CLAIMS_OUTBOX_RELAY_BATCH_SIZE:100}
claims.outbox.relay.send-timeout=${CLAIMS_OUTBOX_RELAY_SEND_TIMEOUT:PT10S}
claims.outbox.retention=${CLAIMS_OUTBOX_RETENTION:P7D}

# Redis is an optional cache; PostgreSQL remains authoritative when it is unavailable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
claims.cache.enabled=${CLAIMS_CACHE_ENABLED:true}
claims.cache.detail-ttl=${CLAIM_CACHE_DETAIL_TTL:PT10M}
claims.cache.status-ttl=${CLAIM_CACHE_STATUS_TTL:PT5M}
