# Application name configuration
spring.application.name=Processing

# PostgreSQL is the production source of truth. DB_PASSWORD is intentionally required.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:claims_processing}
spring.datasource.username=${DB_USERNAME:claims_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation; Hibernate only checks that mappings and migrations agree.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT secrets are supplied by the runtime environment and are never committed.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:claims-processing-api}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Email configuration for Spring Boot to use Gmail for sending emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com  # Use your actual Gmail username
spring.mail.password=your-password         # Use your actual Gmail password
spring.mail.properties.mail.smtp.auth=true       # Authentication flag
spring.mail.properties.mail.smtp.starttls.enable=true  # TLS must be enabled

# Kafka claim-status event flow. One partition/replica is the low-cost local default;
# production deployments can increase both through environment variables.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CLAIM_STATUS_GROUP:claims-notifications-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
claims.kafka.topics.claim-status=${KAFKA_CLAIM_STATUS_TOPIC:claims.status.v1}
claims.kafka.topics.claim-status-dlt=${KAFKA_CLAIM_STATUS_DLT_TOPIC:claims.status.v1.dlt}
claims.kafka.retry.interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}
claims.kafka.retry.max-retries=${KAFKA_MAX_RETRIES:2}
claims.kafka.create-topics=${KAFKA_CREATE_TOPICS:true}
claims.kafka.topic-partitions=${KAFKA_TOPIC_PARTITIONS:1}
claims.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}

# Log4j2 root logger configuration
rootLogger.level = info
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = Standard Console
rootLogger.appenderRef.file.ref = File

# Console appender configuration for logging
appender.console.type = Console
appender.console.name = Standard Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# File appender configuration for logging to a file
appender.file.type = File
appender.file.name = File
appender.file.fileName = logs/app.log  # Log file path
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# Log rotation policies and strategy
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 20

# Splunk HEC (HTTP Event Collector) configuration
splunk.hec.uri=https://your-splunk-instance:8088
splunk.hec.token=your-hec-token   # HEC authentication token
splunk.hec.index=your-index       # Index to send data to

# Redis is an optional cache; PostgreSQL remains authoritative when it is unavailable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
claims.cache.detail-ttl=${CLAIM_CACHE_DETAIL_TTL:PT10M}
claims.cache.status-ttl=${CLAIM_CACHE_STATUS_TTL:PT5M}

# OAuth2 client configuration for Google
spring.security.oauth2.client.registration.google.client-id=your-client-id
spring.security.oauth2.client.registration.google.client-secret=your-client-secret
spring.security.oauth2.client.registration.google.scope=openid, email, profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub
