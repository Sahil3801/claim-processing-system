# Railway demo profile, used together with "production": SPRING_PROFILES_ACTIVE=production,railway.
# Railway injects PORT. The default all-interfaces bind is dual-stack where IPv6 exists, which
# Railway's private network needs, so the bind address is left unset.
server.port=${PORT:8080}

# No Kafka broker on Railway, to keep the demo within the Hobby plan. Status events are still
# written to the transactional outbox in PostgreSQL; the relay and email consumer stay off.
claims.outbox.relay.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
claims.kafka.create-topics=false

# Small container: keep the database pool and Tomcat threads modest.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:30}
