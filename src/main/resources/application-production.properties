# EC2/RDS production profile. Secrets remain runtime environment variables.
server.shutdown=graceful
server.forward-headers-strategy=framework
server.compression.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# Keep the connection footprint appropriate for a burstable RDS instance.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:840000}
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}

# Redis is a disposable cache. Its loss must not make the PostgreSQL-backed API unready.
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
management.endpoint.health.probes.add-additional-paths=true

# Bound request concurrency for a small EC2 instance.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
