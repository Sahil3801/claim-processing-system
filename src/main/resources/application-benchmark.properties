# Isolated performance-test profile. Never use the benchmark credentials or dataset in production.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.root=WARN
management.health.redis.enabled=false

# Explicit toggle used by the controlled PostgreSQL-versus-Redis comparison.
claims.cache.enabled=${CLAIMS_CACHE_ENABLED:true}

# Cache-isolation trials can remove the otherwise intentional database-backed JWT
# user lookup. The mixed API workload leaves this false to mirror production.
benchmark.security.static-users=${BENCHMARK_STATIC_USERS:false}

# Fixed small-host limits are supplied by benchmarks/docker-compose.benchmark.yml.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:12}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:80}
