# Health is public but shows only the overall status; components, details, info, and metrics
# require an ADMIN token (see SecurityConfig). Every other endpoint stays unexposed.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-components=when-authorized
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
# The overall status covers PostgreSQL, Redis, and Kafka. Readiness gates traffic on PostgreSQL
# only: Redis is a disposable cache and the outbox buffers events while Kafka is down.
management.endpoint.health.group.readiness.include=readinessState,db
