name: claims-benchmark

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: claims_benchmark
      POSTGRES_USER: claims_app
      POSTGRES_PASSWORD: benchmark-only-postgres-password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
    tmpfs:
      - /var/lib/postgresql/data:size=768m
    volumes:
      - ./db:/benchmark/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_app -d claims_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 160
    shm_size: 128mb
    networks: [benchmark]

  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - benchmark-only-redis-password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=benchmark-only-redis-password redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    networks: [benchmark]

  kafka:
    image: apache/kafka:3.9.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    tmpfs:
      - /tmp:size=64m
      - /var/lib/kafka/data:size=256m,mode=0777
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 250
    networks: [benchmark]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: claims-processing-api:benchmark
    environment:
      SPRING_PROFILES_ACTIVE: benchmark
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: claims_benchmark
      DB_USERNAME: claims_app
      DB_PASSWORD: benchmark-only-postgres-password
      DB_POOL_MAX_SIZE: 12
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: benchmark-only-redis-password
      CLAIMS_CACHE_ENABLED: ${CLAIMS_CACHE_ENABLED:-true}
      BENCHMARK_STATIC_USERS: ${BENCHMARK_STATIC_USERS:-false}
      CLAIM_CACHE_DETAIL_TTL: PT30M
      CLAIM_CACHE_STATUS_TTL: PT30M
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CREATE_TOPICS: "true"
      KAFKA_TOPIC_PARTITIONS: 1
      KAFKA_TOPIC_REPLICAS: 1
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      JWT_SECRET: benchmark-only-jwt-secret-at-least-32-characters
      JWT_ISSUER: claims-benchmark
      JWT_EXPIRATION_MS: 3600000
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0
        -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BENCHMARK_APP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 220
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=32m
    networks: [benchmark]

  k6:
    image: grafana/k6:2.2.0
    profiles: [tools]
    user: "0:0"
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 150
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    networks: [benchmark]

networks:
  benchmark:
    driver: bridge
